<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%" fill="none">
  <style>
    .sde-axis { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 6; opacity: 0.4; }
    .manifold-orbit-1 { stroke: #00e5ff; stroke-width: 1; stroke-dasharray: 6 8; opacity: 0.3; }
    .manifold-orbit-2 { stroke: #00f59b; stroke-width: 1.2; stroke-dasharray: 4 6; opacity: 0.4; }
    .manifold-orbit-3 { stroke: #00f59b; stroke-width: 1.5; opacity: 0.5; }
    .streamline { stroke: url(#streamlineGrad); stroke-width: 1.5; stroke-dasharray: 3 5; }
    .trajectory { stroke: url(#trajectoryGrad); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; filter: url(#glow); }
    .node-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #cbd5e1; font-weight: 600; }
    .target-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #00f59b; font-weight: 700; }
    .target-ring { stroke: #00f59b; stroke-width: 1.5; stroke-dasharray: 2 3; opacity: 0.8; }
    .node-cyan { fill: #00e5ff; }
    .node-green { fill: #00f59b; }

    @media (prefers-color-scheme: light) {
      .sde-axis { stroke: #cbd5e1; opacity: 0.8; }
      .manifold-orbit-1 { stroke: #0369a1; opacity: 0.4; }
      .manifold-orbit-2 { stroke: #047857; opacity: 0.5; }
      .manifold-orbit-3 { stroke: #047857; opacity: 0.6; }
      .node-text { fill: #475569; }
      .target-text { fill: #047857; }
      .target-ring { stroke: #047857; }
      .node-cyan { fill: #0369a1; }
      .node-green { fill: #047857; }
    }
  </style>

  <defs>
    <linearGradient id="trajectoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="60%" stop-color="#00f59b" />
      <stop offset="100%" stop-color="#00f59b" />
    </linearGradient>
    <linearGradient id="streamlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f59b" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Coordinate Axes -->
  <g class="sde-axes">
    <line x1="40" y1="200" x2="480" y2="200" class="sde-axis" />
    <line x1="260" y1="20" x2="260" y2="380" class="sde-axis" />
  </g>

  <!-- Layer 1: Concentric Manifold Orbits -->
  <ellipse cx="260" cy="200" rx="190" ry="135" class="manifold-orbit-1" />
  <ellipse cx="260" cy="200" rx="130" ry="90" class="manifold-orbit-2" />
  <ellipse cx="260" cy="200" rx="65" ry="45" class="manifold-orbit-3" />

  <!-- Layer 2: Velocity Field Vector Streamlines -->
  <path d="M 60 60 C 140 110, 200 160, 260 200" class="streamline" />
  <path d="M 460 60 C 380 110, 320 160, 260 200" class="streamline" />
  <path d="M 60 340 C 140 290, 200 240, 260 200" class="streamline" />
  <path d="M 460 340 C 380 290, 320 240, 260 200" class="streamline" />

  <!-- Layer 3: Reverse-Time SDE Sample Trajectory -->
  <path d="M 80 75 C 130 50, 175 135, 210 110 C 245 85, 220 170, 275 150 C 330 130, 360 250, 310 230 C 270 215, 265 205, 260 200" class="trajectory" />

  <!-- Layer 4: Discrete Euler-Maruyama Time Step Nodes -->
  <!-- x_T (Initial Gaussian Prior) -->
  <circle cx="80" cy="75" r="5" class="node-cyan" />
  <text x="88" y="70" class="node-text">x_T ~ N(0, I)</text>

  <!-- Intermediate Step Nodes -->
  <circle cx="175" cy="135" r="3.5" class="node-cyan" />
  <text x="182" y="130" class="node-text" font-size="10">t_3</text>

  <circle cx="275" cy="150" r="3.5" class="node-green" />
  <text x="282" y="145" class="node-text" font-size="10">t_2</text>

  <circle cx="310" cy="230" r="3.5" class="node-green" />
  <text x="318" y="235" class="node-text" font-size="10">t_1</text>

  <!-- x_0 (Target Distribution Center) -->
  <circle cx="260" cy="200" r="6" class="node-green" filter="url(#glow)" />
  <circle cx="260" cy="200" r="12" class="target-ring" />
  <text x="272" y="205" class="target-text">x_0 (Target)</text>
</svg>
